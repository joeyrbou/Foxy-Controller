<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080b12" />
    <title>Foxy Suit Control</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell" id="commandPage">
      <header class="topbar">
        <div>
          <p class="eyebrow">FOXY // SUIT CONTROL</p>
          <h1>Command Deck</h1>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="fullscreenButton" type="button" aria-label="Enter full screen" title="Full screen">⛶</button>
          <button class="icon-button" id="libraryButton" type="button" aria-label="Open sound library" title="Sound library">›</button>
          <button class="connection-button" id="connectButton" type="button" aria-label="Connect to suit">
          <span class="connection-dot" aria-hidden="true"></span>
          <span id="connectionText">Demo mode</span>
          </button>
        </div>
      </header>

      <section class="sound-panel panel" aria-labelledby="sound-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">AUDIO SYSTEM</p>
            <h2 id="sound-heading">Voice lines</h2>
          </div>
          <button class="stop-button" id="stopButton" type="button">Stop</button>
        </div>

        <div class="now-playing" id="nowPlaying" aria-live="polite">
          <span class="equalizer" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>Ready for a command</span>
        </div>

        <div class="soundboard">
          <button class="voice-button" type="button" data-line="I came for ye booty." data-audio="assets/i-came-for-ye-booty.mp3">
            <span class="voice-icon">⚓</span><span>Ye booty</span>
          </button>
          <button class="voice-button" type="button" data-line="Never underestimate the cunning of a pirate." data-audio="assets/never-underestimate-a-pirate.mp3">
            <span class="voice-icon">☠</span><span>Cunning pirate</span>
          </button>
          <button class="voice-button" type="button" data-line="Pirate song" data-audio="assets/pirate-song.ogg">
            <span class="voice-icon">♫</span><span>Pirate song</span>
          </button>
          <button class="voice-button" type="button" data-line="Showtime: Talking in Your Sleep" data-audio="assets/showtime-talking-in-your-sleep.mp3">
            <span class="voice-icon">★</span><span>Showtime</span>
          </button>
          <button class="voice-button" type="button" data-line="Boo" data-audio="assets/boo.mp3">
            <span class="voice-icon">👁</span><span>Boo</span>
          </button>
          <button class="voice-button" type="button" data-line="Dum Dum" data-audio="assets/dum-dum.mp3">
            <span class="voice-icon">♬</span><span>Dum Dum</span>
          </button>
        </div>
      </section>

    </main>
    <main class="app-shell library-page" id="libraryPage" hidden>
      <header class="topbar">
        <button class="back-button" id="backButton" type="button" aria-label="Back to soundboard">‹ <span>Soundboard</span></button>
        <button class="icon-button" id="libraryFullscreenButton" type="button" aria-label="Enter full screen" title="Full screen">⛶</button>
      </header>
      <section class="library-panel panel" aria-labelledby="library-heading">
        <p class="eyebrow">YOUR SOUNDS</p>
        <h1 id="library-heading">Sound Library</h1>
        <p class="library-copy">Add an MP3 from your phone. It will become a new soundboard button and stay saved on this device.</p>
        <label class="add-sound-button" for="audioPicker"><span>+</span> Add MP3 sound</label>
        <input id="audioPicker" type="file" accept="audio/mpeg,audio/mp3,.mp3" hidden multiple />
        <p class="upload-status" id="uploadStatus" aria-live="polite"></p>
        <div class="library-list" id="libraryList"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
